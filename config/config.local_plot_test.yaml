# Local test only: plot the existing disruption networks without solving anything.
# Load after config.sector_2025.yaml and config.interconnector_disruption.yaml:
#
#   pixi run snakemake plot_disruptions --config plot_existing_only=true \
#     --allowed-rules plot_outage_dispatch plot_outage_missing_demand \
#     --configfiles config/config.sector_2025.yaml config/config.interconnector_disruption.yaml \
#                   config/config.local_plot_test.yaml --cores 2
#
# Existing local results: {output_directory}/{case}/network_solved.nc.
# Inherit the eight case names and plot labels from config.interconnector_disruption.yaml.
# This overlay selects saved results; their solve settings remain those stored in each network.
# Plot outputs go to {output_directory}/{case}/plots/ and {output_directory}/plots/.
run:
  default_target_rule: plot_disruptions

disruption:
  output_directory: results/disruptions/sector_2025_dispatch
  weather_years: null # Preserve the legacy flat layout of these saved networks.
  plotting:
    existing_only: true
