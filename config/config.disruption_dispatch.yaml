# Load after config.sector_2025.yaml and, on Sophia, config.sophia.yaml.
# This replaces the stack of disruption/rolling overlays for new runs.
# The donor weather network must already exist; do not load its build config.
run:
  default_target_rule: dispatch_disruptions

disruption:
  base_network: results/sector_2025/networks/base_s_10___2025.nc
  household_shares: results/sector_2025/csvs/household_heat_shares_base_s_10___2025.csv
  planning_horizon: 2025
  output_directory: results/disruptions/sector_2025_dispatch
  iis_time_limit: 300

  rolling_horizon:
    horizon: 168 # Hourly snapshots: seven-day look-ahead.
    overlap: 48 # Implement horizon - overlap = 48 hours each solve.
    simulation:
      start: null
      end: null # Exclusive; null runs the complete network calendar.
    resources:
      apply_scarcity_prices: true
      enforce_allowances: false
      overrides: {}
    storage:
      initial_state: base_previous_snapshot
      msv:
        enable: true
        source: mu_energy_balance
        aggregation: hourly
        aggregation_by_carrier:
          gas: annual_mean
          biomass: annual_mean
          coal: annual_mean
          lignite: annual_mean
          oil: annual_mean
          methanol: annual_mean
          H2 Store: annual_mean
          ammonia store: annual_mean
        stores:
          carriers: [urban central water pits, gas, biomass, coal, lignite, oil, methanol, H2 Store, ammonia store]
          assets: []
        storage_units:
          carriers: [hydro]
          assets: []
    co2:
      replace_budget_with_price: true
    waste_hvc:
      mode: uniform_arrivals
      treatment_period_hours: 168
      backlog_hours: 168
      initial_backlog_MWh: 0
      require_empty_at_period_end: true

  # Optional fixed distribution-capacity adjustments, e.g. {FI: 1.12, SE: 1.006}.
  low_voltage_capacity_multipliers: {}
  fuel_backup:
    enable: true
    capacity_multiplier: 1.0
    marginal_cost_premium: 0.1
    carriers:
      - land transport oil
      - gas for industry
      - coal for industry
      - solid biomass for industry
      - industry methanol
      - kerosene for aviation
      - shipping oil
      - shipping methanol
      - agriculture machinery oil
  load_shedding:
    elec_cost: 10000
    heat_cost: 20000

  # dispatch_disruptions runs every case listed here with shared settings above.
  # Each case can combine a prepared donor weather network and multiple outages.
  cases:
    base_weather:
      weather_network: null
      interconnector_outages: []

    eastern_denmark_outage:
      weather_network: null
      interconnector_outages:
        - name: eastern_denmark_isolation
          # Example seven-day outage. Change these dates for the experiment.
          # Base-network calendar is July 2013-June 2014, not planning year 2025.
          # Start inclusive; end exclusive; timestamps use the model's time basis.
          start: "2014-01-10 00:00"
          end: "2014-01-17 00:00"
          lines: ["4"] # DK0 0AC (Eastern Denmark) - SE0 0AC.
          links: # Include both directional representations.
            - relation/2505320-400-DC
            - relation/2505320-400-DC-reversed
            - relation/5487095-400-DC
            - relation/5487095-400-DC-reversed

    # historical_weather:
    #   weather_network: resources/weather_1965_66/sector_2025/networks/base_s_10___2025.nc
    #   interconnector_outages: [] # Or add dated outages as above.

solving:
  options:
    rolling_horizon: true # false selects full-horizon dispatch.
    load_shedding:
      enable: false # Already supplied by network preparation.
  solver_options:
    gurobi-default:
      BarConvTol: 1.0e-8
      FeasibilityTol: 1.0e-7
      OptimalityTol: 1.0e-7
      crossover: -1
