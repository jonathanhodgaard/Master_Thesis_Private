# Nicoline-style fuel USE restrictions, limited to one consumption boundary.
# Reduce consuming Links, never fuel supply Generators, pipelines or oil refining.
# Gas: power/CHP/boilers/industry delivery/SMR. Oil: power/CHP/boilers/final-use delivery.
# reduction means capacity removed: 0.5 leaves 50%, 0.75 leaves 25%, 0.9 leaves 10%.
# Select optional countries (consuming region) or exact eligible links per event.
# Standalone overlay: do NOT load interconnector or old fuel-supply campaign configs.
run:
  default_target_rule: dispatch_disruptions
disruption:
  base_network: results/sector_2025/networks/base_s_10___2025.nc
  household_shares: results/sector_2025/csvs/household_heat_shares_base_s_10___2025.csv
  planning_horizon: 2025
  output_directory: results/disruptions/sector_2025_fuel_use_disruption
  default_weather_year: 2013-2014
  weather_years:
    2013-2014:
      weather_network: null
    1965-1966:
      weather_network: resources/weather_1965_66/sector_2025/networks/base_s_10___2025.nc
    1968-1969:
      weather_network: resources/weather_1968_69/sector_2025/networks/base_s_10___2025.nc
    1988-1989:
      weather_network: resources/weather_1988_89/sector_2025/networks/base_s_10___2025.nc
    2019-2020:
      weather_network: resources/weather_2019_20/sector_2025/networks/base_s_10___2025.nc
  iis_time_limit: 300
  rolling_horizon:
    horizon: 168
    overlap: 48
    simulation:
      start: null
      end: null
    resources:
      apply_scarcity_prices: true
      enforce_allowances: true
      overrides: {}
      import_capacity_MW: null
    storage:
      initial_state: base_previous_snapshot
      initial_inventory:
      - countries:
        - NL
        - DE
        - DK
        - SE
        - 'NO'
        - FI
        - GB
        carriers:
        - biomass
        start_month_day: 07-01
        fill_fraction: 0.0
        basis: 'Zero opening solid-biomass inventory sensitivity: remove inherited
          cyclic reference stocks so domestic supply and imports account for all material
          used.'
      - assets:
        - EU coal Store
        - EU oil Store
        carriers:
        - coal
        - oil
        start_month_day: 07-01
        fill_fraction: 0.0
        basis: 'Zero opening coal and refined-oil inventory sensitivity: replace uncalibrated
          cyclic reference endowments with purchases during dispatch.'
      msv:
        enable: true
        source: mu_energy_balance
        aggregation: hourly
        aggregation_by_carrier:
          urban central water pits: monthly_mean
          gas: annual_mean
          biomass: annual_mean
          coal: annual_mean
          lignite: annual_mean
          oil: annual_mean
          methanol: annual_mean
          H2 Store: annual_mean
          ammonia store: annual_mean
          hydro: annual_mean
        stores:
          carriers:
          - urban central water pits
          - gas
          - biomass
          - coal
          - lignite
          - oil
          - methanol
          - H2 Store
          - ammonia store
          assets: []
        storage_units:
          carriers:
          - hydro
          assets: []
    co2:
      replace_budget_with_price: true
    waste_hvc:
      mode: uniform_arrivals
      treatment_period_hours: 168
      backlog_hours: 168
      initial_backlog_MWh: 0
      require_empty_at_period_end: true
  low_voltage_capacity_multipliers:
    FI: 1.0
    SE: 1.0
  heat_vent:
    resize_to_heat_input_capacity: true
  fuel_backup:
    enable: false
  load_shedding:
    elec_cost: 23300
    heat_cost: 100000
    fuel:
      enable: true
      default_cost: 23300
      hydrogen_balance:
        enable: true
        # null inherits the common fuel price (including hydrogen/carrier overrides).
        # Also covers process H2 use at buses with no final hydrogen Load.
        cost: null
        costs_by_bus: {}
      costs_by_fuel: {}
      costs_by_carrier: {}
      costs_by_load: {}
      regional_cost_adders: {}
      demand_carriers: {}
    regional_cost_adders:
      DK0 0AC: 100
  plotting:
    enable: false
    region: DK0 0AC
    region_label: DK2
  cases:
    base_weather:
      interconnector_outages: []
      fuel_link_disruptions: []
      fuel_generator_disruptions: []
    gas_reduction_50:
      interconnector_outages: []
      fuel_link_disruptions:
      - name: gas_reduction_50
        fuel: gas
        reduction: 0.5
        start: 2014-01-08 00:00
        end: 2014-01-22 00:00
      fuel_generator_disruptions: []
    gas_reduction_75:
      interconnector_outages: []
      fuel_link_disruptions:
      - name: gas_reduction_75
        fuel: gas
        reduction: 0.75
        start: 2014-01-08 00:00
        end: 2014-01-22 00:00
      fuel_generator_disruptions: []
    gas_reduction_90:
      interconnector_outages: []
      fuel_link_disruptions:
      - name: gas_reduction_90
        fuel: gas
        reduction: 0.9
        start: 2014-01-08 00:00
        end: 2014-01-22 00:00
      fuel_generator_disruptions: []
    oil_reduction_50:
      interconnector_outages: []
      fuel_link_disruptions:
      - name: oil_reduction_50
        fuel: oil
        reduction: 0.5
        start: 2014-01-08 00:00
        end: 2014-01-22 00:00
      fuel_generator_disruptions: []
    oil_reduction_75:
      interconnector_outages: []
      fuel_link_disruptions:
      - name: oil_reduction_75
        fuel: oil
        reduction: 0.75
        start: 2014-01-08 00:00
        end: 2014-01-22 00:00
      fuel_generator_disruptions: []
    oil_reduction_90:
      interconnector_outages: []
      fuel_link_disruptions:
      - name: oil_reduction_90
        fuel: oil
        reduction: 0.9
        start: 2014-01-08 00:00
        end: 2014-01-22 00:00
      fuel_generator_disruptions: []
solving:
  options:
    rolling_horizon: true
    load_shedding:
      enable: false
  solver_options:
    gurobi-default:
      BarConvTol: 1.0e-08
      FeasibilityTol: 1.0e-07
      OptimalityTol: 1.0e-07
      crossover: -1
