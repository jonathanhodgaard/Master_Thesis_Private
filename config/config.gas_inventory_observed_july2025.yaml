# Optional sensitivity: load after config.interconnector_disruption.yaml.
# Same physical network and fuel caps; only initial Danish gas stock differs.
disruption:
  output_directory: results/disruptions/sector_2025_dispatch_fuel_caps_july33
  rolling_horizon:
    storage:
      initial_inventory:
        - countries: [DK]
          carriers: [gas]
          start_month_day: "07-01"
          fill_fraction: 0.33
          basis: "Observed Danish end-June 2025 stock, rounded to 33% by ENS: https://ens.dk/presse/udbud-skal-bidrage-til-fylde-gaslagre-foer-vinteren ; common regional fraction is an assumption; capacity remains the frozen reference rating."
