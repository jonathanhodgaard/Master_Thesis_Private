# December-March screening; 1965/66 and 1968/69 selected by batch script.
# Load after the fuel-use campaign. End date is exclusive.
# Gas consuming-Link capacity reduced by 90% throughout the simulation.
disruption:
  base_network: results/sector_2035_wo_V2G/networks/base_s_10___2035.nc
  household_shares: results/sector_2035_wo_V2G/csvs/household_heat_shares_base_s_10___2035.csv
  planning_horizon: 2035
  output_directory: results/disruptions/sector_2035_wo_V2G_fuel_use_dec_mar_gas90_h2_200000_test
  load_shedding:
    fuel:
      hydrogen_balance:
        cost: 200000
  default_weather_year: 1965-1966
  weather_years:
    2013-2014:
      weather_network: null
    1965-1966:
      weather_network: resources/weather_1965_66/sector_2035_wo_V2G/networks/base_s_10___2035.nc
    1968-1969:
      weather_network: resources/weather_1968_69/sector_2035_wo_V2G/networks/base_s_10___2035.nc
    1988-1989:
      weather_network: resources/weather_1988_89/sector_2035_wo_V2G/networks/base_s_10___2035.nc
    2019-2020:
      weather_network: resources/weather_2019_20/sector_2035_wo_V2G/networks/base_s_10___2035.nc
  rolling_horizon:
    horizon: 168
    overlap: 48
    simulation:
      start: 2013-12-01 00:00
      end: 2014-04-01 00:00
    storage:
      initial_inventory: []
  plotting:
    enable: false
  cases:
    gas_reduction_90:
      interconnector_outages: []
      fuel_generator_disruptions: []
      fuel_link_disruptions:
      - name: gas_reduction_90
        fuel: gas
        reduction: 0.9
        start: 2013-12-01 00:00
        end: 2014-04-01 00:00
