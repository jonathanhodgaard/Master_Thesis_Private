#tutorial: true


run:
  name: "base_2025_sector_june_july_2013_2014" # use this to keep track of runs with different settings
  disable_progressbar: true



scenario:
  clusters:
  - 10 # Minimum for the selected countries and disconnected AC subnetworks.
  planning_horizons:
  - 2025 # setting horizon to 2025



countries: ['NL', 'DE', 'DK', 'SE', 'NO', 'FI', 'GB'] # included countries

snapshots:
  start: "2013-07-01"
  end: "2014-07-01"
  inclusive: left

co2_budget: null #no co2 budget, only a co2 price for this run

electricity:
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []
    
  estimate_renewable_capacities:
    year: 2025
  estimate_battery_capacities: true
  transmission_limit: v1.0 #cannot expand transmission capacity


atlite:
  default_cutout: europe-2011-2016-era5
  cutouts:
    "europe-2011-2016-era5":
      module: era5
      x: [-12.0, 35.0]
      y: [33.0, 72.0]
      time: ["2011-01-01", "2016-12-31"]


foresight: overnight   

sector:
  district_heating:
    potential:
      DK:    0.752 #This number results in disctrict heating share of 70% urban central heating. https://danskfjernvarme.dk/om-os/fakta-om-fjernvarme
                   #0.7/0.93= 0.752. 0.93 is the share of people living in urban areas in Denmark according to pypsa-eur workflow.
      default: 0.0 #Uses historic values for all other countries.
    progress:
        2025: 1.0
  heat_pump_sources:
    rural:
    - air #ASSUMPTION of only air heat pump for rural data. No data available on heat pump type.
  #For residential heat, we can enable dsm = true when doing 2035.
  household_heat_allocation:
    enable: true
    remove_unbuilt_auxiliaries: true
  
  
  bev_dsm: false #Almost negiligible effect on 2025. Can be set to true for 2035.
  v2g: false #turn on by 2035? https://ens.dk/media/8525/download 
  # EV share per country and year (added ourselves). Countries/years missing here fall back to land_transport_electric_share.
  # 2035 = our own 2025 estimate + 40 percentage points (projected to raise with 40 % from 2025 to 2035 in pypsa eur) same increase for all countries.
  land_transport_electric_share_by_country:
    NL: {2025: 0.083, 2035: 0.484}
    DE: {2025: 0.035, 2035: 0.435}
    DK: {2025: 0.11, 2035: 0.511}
    SE: {2025: 0.084, 2035: 0.484}
    'NO': {2025: 0.215, 2035: 0.615} # quoted, otherwise YAML reads NO as false
    FI: {2025: 0.06, 2035: 0.46}
    GB: {2025: 0.069, 2035: 0.469}
  # Existing capacities from data/existing_infrastructure (added ourselves). If missing: applied in every year.
  existing_infrastructure:
    apply_in_years: [2025] # years in which the CSV capacities are applied
    keep_extendable: true # p_nom_min = existing capacity, solver may build more
    chp_heat_capacities: data/existing_infrastructure/existing_chp_heat_capacities.csv
    rural_decentral_heat_capacities: data/existing_infrastructure/existing_rural_decentral_heat_capacities.csv
    solar_rooftop_capacities: data/existing_infrastructure/existing_solar_rooftop_capacities.csv
  # Fix existing capacity and block new capacity (added ourselves). If missing: nothing is fixed.
  fix_existing_capacity:
    enable: true
    countries: [DK]
    years: [2025]
    keep_extendable_carriers: "(rural|urban decentral) gas boiler" # regex; covers services and agriculture heat not in the CSVs
    block_new_carriers: [urban central coal CHP, urban central oil CHP, coal, lignite, CCGT, OCGT]
    block_new_carrier_suffixes: [" CC"] # carbon capture variants
    pit_storage_MWh: # fixed pit thermal storage; DK1/DK2 are mapped to the network's buses by location
      DK2: 45000 # Eastern Denmark
      DK1: 55000 # Western Denmark
  #retrogen for 2035 might be a good idea to set true
  overdimension_heat_generators: #no oversizing, since we have the actual heat capacity
    decentral: 1.0 
  chp:
    enable: true
    fuel:
    - gas
    - solid biomass
    - coal #Added ourselves in codebase
    - oil #Added ourselves in codebase
    micro_chp: false
  dac: false #All the next settings are basically non-existing in northern europe.
  hydrogen_fuel_cell: false
  hydrogen_turbine: false
  SMR_cc: false
  oil_boilers: true


  hydrogen_underground_storage: false  
  methanol: #basically non-existing in northern europe, so we set all to false
    methanol_to_power:
      ccgt: false
      ccgt_cc: false
      ocgt: false
      allam: false
    biomass_to_methanol: false

  ammonia: false

  H2_network: false

  biomass_transport: true

  conventional_generation:
    OCGT: gas
    CCGT: gas
    coal: coal
    lignite: lignite
    oil: oil
    #nuclear: uranium #makes no difference
    biomass: biomass          # was "solid biomass", that's not a spatial attribute. Might be resulting in    

  electrobiofuels: false #basically non-existing in commercial scale 2025.
  municipal_solid_waste: true
  solid_biomass_import: #do dynamic pricing instead of fixed? As per the default setting.
    enable: true
  

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#costs
industry:
  waste_to_energy: true


costs:
  year: 2025
  emission_prices: #Undersøg også "dynamic" funktionen
    enable: true
    co2: 100.51 #DK price in 2025
    #https://taxfoundation.org/data/all/eu/carbon-taxes-europe/

clustering:
  temporal:
    resolution_sector: 1h  

solving:
  model_kwargs:
    solver_dir: "/scratch"
  solver:
    name: gurobi
    options: gurobi-default
  solver_options:
    gurobi-default:
      threads: 8
  mem_mb: 60000
  runtime: 12h


data:
  cutout:
    source: archive
    version: v1.0