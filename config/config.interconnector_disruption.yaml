# Load after the matching sector config and, on Sophia, config.sophia.yaml.
# 2035 campaigns append their matching interconnector overlay after this file.
# This replaces the stack of disruption/rolling overlays for new runs.
# The donor weather network must already exist; do not load its build config.
run:
  default_target_rule: dispatch_disruptions

disruption:
  base_network: results/sector_2025/networks/base_s_10___2025.nc
  household_shares: results/sector_2025/csvs/household_heat_shares_base_s_10___2025.csv
  planning_horizon: 2025
  output_directory: results/disruptions/sector_2025_interconnector_disruption
  # One campaign per invocation. Array jobs select a weather year and case.
  # Outputs: {output_directory}/{weather_year}/{case}/.
  default_weather_year: "2013-2014"
  weather_years:
    "2013-2014":
      weather_network: null # Original solved reference weather.
    "1964-1965":
      weather_network: resources/weather_1964_65/sector_2025/networks/base_s_10___2025.nc
    "1965-1966":
      weather_network: resources/weather_1965_66/sector_2025/networks/base_s_10___2025.nc
    "1968-1969":
      weather_network: resources/weather_1968_69/sector_2025/networks/base_s_10___2025.nc
    "1982-1983":
      weather_network: resources/weather_1982_83/sector_2025/networks/base_s_10___2025.nc
  iis_time_limit: 300

  rolling_horizon:
    horizon: 168 # Hourly snapshots: seven-day look-ahead.
    overlap: 48 # Implement horizon - overlap = 120 hours each solve.
    simulation:
      start: null # Full reference calendar: July 2013-June 2014.
      end: null # Exclusive cutoff when set; independent of outage dates below.
    resources:
      apply_scarcity_prices: true
      # Preserve finite domestic biofuel/resource limits and the configured import
      # allowance across windows. Scarcity prices still guide conservation.
      # Domestic production is allowed UP TO its annual potential, not forced.
      # The 1390 TWh biomass-import allowance is a scenario assumption, not data.
      enforce_allowances: true
      overrides: {}
      # Dispatch-only solid-biomass import capacity (MW) for each regional delivery
      # link and for the shared import supply. The reference keeps only its own peak
      # (41 MW, DK0), so donor years with earlier-exhausted domestic allowances went
      # infeasible near June (window 67 needs 5-10 GW). null keeps reference sizes.
      import_capacity_MW: 50000
    storage:
      initial_state: base_previous_snapshot # Gas and other unlisted stores retain reference states.
      initial_inventory:
        - countries: ["NL", "DE", "DK", "SE", "NO", "FI", "GB"]
          carriers: [biomass]
          start_month_day: "07-01"
          fill_fraction: 0.0
          # One opening-state adjustment, not a reset at each rolling window.
          # All subsequent biomass must enter via capped domestic supply,
          # interregional transfers, or the separately capped external imports.
          basis: "Zero opening solid-biomass inventory sensitivity: remove inherited cyclic reference stocks so domestic supply and imports account for all material used."
        # These shared fuel buses have no country code; select their Stores directly.
        - assets: ["EU coal Store", "EU oil Store"]
          carriers: [coal, oil]
          start_month_day: "07-01"
          fill_fraction: 0.0
          # Keep inventory capacities, supply Generators and refining Links intact.
          basis: "Zero opening coal and refined-oil inventory sensitivity: replace uncalibrated cyclic reference endowments with purchases during dispatch."
      msv:
        enable: true
        source: mu_energy_balance
        aggregation: hourly
        aggregation_by_carrier:
          gas: annual_mean
          biomass: annual_mean
          coal: annual_mean
          lignite: annual_mean
          oil: annual_mean
          methanol: annual_mean
          H2 Store: annual_mean
          ammonia store: annual_mean
          hydro: annual_mean
        stores:
          carriers: [urban central water pits, gas, biomass, coal, lignite, oil, methanol, H2 Store, ammonia store]
          assets: []
        storage_units:
          carriers: [hydro]
          assets: []
    co2:
      replace_budget_with_price: true
    waste_hvc:
      mode: uniform_arrivals
      treatment_period_hours: 168
      backlog_hours: 168
      initial_backlog_MWh: 0
      require_empty_at_period_end: true

  # Fixed capacity sensitivity, applied before outages, in both flow directions.
  # Current expansion settings: Finland +15%, Sweden +2%.
  low_voltage_capacity_multipliers:
    FI: 1.15
    SE: 1.02
  heat_vent:
    # Resize existing enabled vents to connected maximum heat-input capacities.
    # Applies in every case, including Finland and Sweden; retains disposal costs.
    resize_to_heat_input_capacity: true
  fuel_backup:
    enable: true
    capacity_multiplier: 1.0
    marginal_cost_premium: 0.1
    carriers:
      - land transport oil
      - gas for industry
      - coal for industry
      - solid biomass for industry
      - industry methanol
      - kerosene for aviation
      - shipping oil
      - shipping methanol
      - agriculture machinery oil
  load_shedding:
    elec_cost: 23300 # DEA VoLL Denmark (2023)
    heat_cost: 100000 # Gøtske (2024)

  # Outage plots (rules/plot_disruption.smk), made after each case is solved.
  # Under each weather year: {case}/plots/ and comparison plots in plots/.
  plotting:
    enable: true
    region: DK0 0AC          # model cluster DK0 = Zealand (bidding zone DK2); cluster DK2 = Jutland
    region_label: DK2        # used in titles and file names
    shed_noise_mw: 0.1       # hourly load shedding below this is solver noise and set to 0
    # households in the region, for the event table's household equivalent (= share of
    # demand shed x households). Approx. Capital Region (incl. Bornholm) + Region Zealand,
    # ~2.75 M people / ~2.1 per household; replace with Statistics Denmark (FAM55N).
    households: 1300000
    zoom_windows:            # hourly zoom; windows outside the snapshots are skipped
      Summer: ["2013-07-08", "2013-07-21"]
      Winter: ["2014-01-13", "2014-01-26"]
    missing_demand_resample: null   # null = hourly curves; "D" = daily maximum
    case_labels:             # legend names; curve colours follow the order of cases below
      base_weather: Base (no outage)
      se_interconnector: Øresund out
      de_interconnector: Kontek out
      dk1_interconnector: Great Belt out
      se_de_interconnector: Øresund + Kontek out
      se_dk1_interconnector: Øresund + Great Belt out
      de_dk1_interconnector: Kontek + Great Belt out
      eastern_denmark_all: All 3 out
    existing_only: false     # true: plot only cases whose solved network exists (never solve)
    # Case x weather-year heatmaps (snakemake plot_disruption_heatmaps, after the array).
    heatmap:
      reference_weather_year: null   # null = default_weather_year
      reference_case: base_weather   # also the same-year control for vs_same_year
      window: ["2013-12-01", "2014-03-01"]  # same for every case (end exclusive): longest outage
      scarcity_price: 1000           # EUR/MWh; at or above = scarcity hour (normal prices < ~300)

  # dispatch_disruptions runs every case listed here with shared settings above.
  # Each case can combine a prepared donor weather network and multiple outages.
  cases:
    # Matching control: same horizon, prices, inventories and capacity adjustments.
    base_weather:
      weather_network: null
      interconnector_outages: []

    # Single-connection winter outages: December through January.
    se_interconnector:
      weather_network: null
      interconnector_outages:
        - name: se_interconnector_outage
          start: "2013-12-01 00:00"
          end: "2014-02-01 00:00"
          lines: ["4"] # DK0 0AC (Eastern Denmark) - SE0 0AC.

    de_interconnector:
      weather_network: null
      interconnector_outages:
        - name: de_interconnector_outage
          start: "2013-12-01 00:00"
          end: "2014-02-01 00:00"
          links: # Include both directional representations.
            - relation/2505320-400-DC
            - relation/2505320-400-DC-reversed

    dk1_interconnector:
      weather_network: null
      interconnector_outages:
        - name: dk1_interconnector_outage
          start: "2013-12-01 00:00"
          end: "2014-02-01 00:00"
          links: # Include both directional representations.
            - relation/5487095-400-DC
            - relation/5487095-400-DC-reversed

    # Combined winter outages: December through February.
    se_de_interconnector:
      weather_network: null
      interconnector_outages:
        - name: se_de_interconnector_outage
          start: "2013-12-01 00:00"
          end: "2014-03-01 00:00"
          lines: ["4"] # DK0 0AC (Eastern Denmark) - SE0 0AC.
          links: # Include both directional representations.
            - relation/2505320-400-DC
            - relation/2505320-400-DC-reversed

    se_dk1_interconnector:
      weather_network: null
      interconnector_outages:
        - name: se_dk1_interconnector_outage
          start: "2013-12-01 00:00"
          end: "2014-03-01 00:00"
          lines: ["4"] # DK0 0AC (Eastern Denmark) - SE0 0AC.
          links: # Include both directional representations.
            - relation/5487095-400-DC
            - relation/5487095-400-DC-reversed

    de_dk1_interconnector:
      weather_network: null
      interconnector_outages:
        - name: de_dk1_interconnector_outage
          start: "2013-12-01 00:00"
          end: "2014-03-01 00:00"
          links: # Include both directional representations.
            - relation/5487095-400-DC
            - relation/5487095-400-DC-reversed
            - relation/2505320-400-DC
            - relation/2505320-400-DC-reversed
    # Isolation of all three electrical interconnections; dates are set below.
    eastern_denmark_all:
      weather_network: null
      interconnector_outages:
        - name: eastern_denmark_isolation
          # Start inclusive; end exclusive; timestamps use the model's time basis.
          start: "2013-12-01 00:00"
          end: "2014-03-01 00:00"
          lines: ["4"] # DK0 0AC (Eastern Denmark) - SE0 0AC.
          links: # Include both directional representations.
            - relation/2505320-400-DC
            - relation/2505320-400-DC-reversed
            - relation/5487095-400-DC
            - relation/5487095-400-DC-reversed

    # historical_weather:
    #   weather_network: resources/weather_1965_66/sector_2025/networks/base_s_10___2025.nc
    #   interconnector_outages: [] # Or add dated outages as above.

solving:
  options:
    rolling_horizon: true # false selects full-horizon dispatch.
    load_shedding:
      enable: false # Already supplied by network preparation.
  solver_options:
    gurobi-default:
      BarConvTol: 1.0e-8
      FeasibilityTol: 1.0e-7
      OptimalityTol: 1.0e-7
      crossover: -1
